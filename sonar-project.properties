# SonarQube設定ファイル
sonar.projectKey=BrowserSelector
sonar.projectName=BrowserSelector
sonar.projectVersion=0.1.0
sonar.organization=Yosuke-Sh

# ソースコードの場所
sonar.sources=src
sonar.tests=tests

# 除外ファイル
sonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**,**/coverage/**,**/packages/**,**/*.Designer.cs,**/*.g.cs,**/*.g.i.cs

# テスト除外
sonar.test.exclusions=**/bin/**,**/obj/**,**/TestResults/**,**/coverage/**

# カバレッジレポート
sonar.cs.opencover.reportsPaths=coverage-report/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=TestResults/*.trx

# 品質ゲート
sonar.qualitygate.wait=true

# 言語設定
sonar.sourceEncoding=UTF-8

# 分析設定
sonar.analysis.mode=publish
sonar.issuesReport.console.enable=true
sonar.issuesReport.html.enable=true

# セキュリティ設定
sonar.security.hotspots.includeAll=true

# コード重複検出
sonar.cpd.cs.minimumtokens=100

# 複雑度設定
sonar.complexity.max=10
sonar.complexity.threshold=5

# コメント密度
sonar.commentdensity.minimum=20

# ファイルサイズ制限
sonar.maximumFileSize=1000

# スタイル警告の除外設定
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S1101
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1000
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S1413
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e4.ruleKey=csharpsquid:S1208
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e5.ruleKey=csharpsquid:S1633
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e6.ruleKey=csharpsquid:S1200
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.cs