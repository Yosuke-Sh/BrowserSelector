name: Code Quality

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ master, developer ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'BrowserSelector.WPF.sln'

jobs:
  # 静的解析専用ジョブ。テスト実行は ci.yml に一本化済み（Phase F-3）。
  static-analysis:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}

    - name: Build with analyzers (warnings fail the job)
      run: |
        $buildOutput = dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore --verbosity normal 2>&1
        $buildOutput | ForEach-Object { Write-Host $_ }
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed"
          exit 1
        }
        $warnings = $buildOutput | Select-String "warning "
        if ($warnings) {
          Write-Host "::error::Build warnings detected. This project's policy is zero warnings."
          $warnings | ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit 1
        } else {
          Write-Host "✅ No build warnings detected - Build is clean"
        }
