name: Code Quality Analysis

on:
  push:
    branches: [ main, developer ]
  pull_request:
    branches: [ main, developer ]
  schedule:
    - cron: '0 2 * * 1' # 毎週月曜日の午前2時

jobs:
  code-quality:
    runs-on: windows-2022  # windows-latestの代わりに明示的に指定
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # SonarQube用に全履歴を取得
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build project
      run: dotnet build --configuration Release --no-restore
    
    - name: Run Unit Tests
      run: dotnet test tests/BrowserSelector.UnitTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Integration Tests
      run: dotnet test tests/BrowserSelector.IntegrationTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Core Tests
      run: dotnet test tests/BrowserSelector.CoreTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Infrastructure Tests
      run: dotnet test tests/BrowserSelector.InfrastructureTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run App Tests
      run: dotnet test tests/BrowserSelector.AppTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run E2E Tests
      run: dotnet test tests/BrowserSelector.E2ETests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run UI Tests
      run: dotnet test tests/BrowserSelector.UITests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Library Tests
      run: dotnet test tests/BrowserSelector.LibraryTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Performance Tests
      run: dotnet test tests/BrowserSelector.PerformanceTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Run Security Tests
      run: dotnet test tests/BrowserSelector.SecurityTests --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults --verbosity normal
      continue-on-error: true
    
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.10
    
    - name: Generate coverage report
      run: |
        $coverageFiles = Get-ChildItem -Path "TestResults" -Recurse -Name "coverage.cobertura.xml" -ErrorAction SilentlyContinue
        if ($coverageFiles) {
          Write-Host "Found coverage files: $($coverageFiles -join ', ')"
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Cobertura;Html;TextSummary;Lcov"
        } else {
          Write-Host "No coverage files found, creating empty report"
          New-Item -ItemType Directory -Path "coverage-report" -Force
          New-Item -ItemType File -Path "coverage-report/Cobertura.xml" -Force
        }
      continue-on-error: false
    
    - name: Install SonarQube Scanner
      run: dotnet tool install --global dotnet-sonarscanner --version 5.15.1
    
    - name: SonarQube Begin Analysis
      run: |
        dotnet sonarscanner begin /k:"BrowserSelector" /o:"Yosuke-Sh" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="coverage-report/Cobertura.xml" /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: Build and analyze
      run: dotnet build --configuration Release
    
    - name: SonarQube End Analysis
      run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-report/Cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/AllTests/
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage-report/
    
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: romeovs/lcov-reporter-action@v0.3.1
      with:
        lcov-file: coverage-report/lcov.info
        github-token: ${{ secrets.GITHUB_TOKEN }}
        delete-old-comments: true


