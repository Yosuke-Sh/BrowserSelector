name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: 'BrowserSelector.WPF.sln'

jobs:
  # リリースビルド
  build-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      
    - name: Run all tests
      run: |
        dotnet test tests/BrowserSelector.UnitTests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.IntegrationTests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.AppTests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.SecurityTests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.PerformanceTests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.UITests/ --configuration Release --no-build --verbosity normal
        dotnet test tests/BrowserSelector.E2ETests/ --configuration Release --no-build --verbosity normal
        
    - name: Publish application
      run: |
        dotnet publish src/BrowserSelector.App/ --configuration Release --output ./publish/
        
    - name: Create portable package
      run: |
        mkdir -p ./release-artifacts
        Copy-Item -Path "./publish/*" -Destination "./release-artifacts/BrowserSelector-Portable/" -Recurse
        Compress-Archive -Path "./release-artifacts/BrowserSelector-Portable/*" -DestinationPath "./release-artifacts/BrowserSelector-Portable.zip" -Force
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-build
        path: |
          ./publish/
          ./release-artifacts/

  # GitHub Release作成
  create-release:
    runs-on: windows-latest
    needs: build-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-build
        path: ./release-artifacts/
        
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: BrowserSelector ${{ steps.version.outputs.VERSION }}
        body: |
          ## BrowserSelector ${{ steps.version.outputs.VERSION }}
          
          ### 新機能・改善
          - 詳細は[CHANGELOG.md](CHANGELOG.md)を参照してください
          
          ### ダウンロード
          - **ポータブル版**: BrowserSelector-Portable.zip
          - **インストーラー**: 今後追加予定
          
          ### インストール方法
          1. ポータブル版の場合: ZIPファイルを解凍してBrowserSelector.exeを実行
          2. インストーラーの場合: setup.exeを実行してインストール
          
          ### システム要件
          - Windows 10/11
          - .NET 8.0 Runtime
        draft: false
        prerelease: false
        
    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./release-artifacts/BrowserSelector-Portable.zip
        asset_name: BrowserSelector-Portable.zip
        asset_content_type: application/zip
