<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="browserGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景円 -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- ブラウザアイコン群 -->
  <g transform="translate(128, 128)">
    <!-- Chrome -->
    <g transform="translate(-60, -40)">
      <circle cx="0" cy="0" r="25" fill="#4285F4" opacity="0.9"/>
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient)"/>
      <circle cx="0" cy="0" r="15" fill="#4285F4" opacity="0.7"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
    
    <!-- Firefox -->
    <g transform="translate(60, -40)">
      <circle cx="0" cy="0" r="25" fill="#FF7139" opacity="0.9"/>
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient)"/>
      <circle cx="0" cy="0" r="15" fill="#FF7139" opacity="0.7"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
    
    <!-- Edge -->
    <g transform="translate(0, 50)">
      <circle cx="0" cy="0" r="25" fill="#0078D4" opacity="0.9"/>
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient)"/>
      <circle cx="0" cy="0" r="15" fill="#0078D4" opacity="0.7"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- 選択矢印 -->
  <g transform="translate(128, 128)">
    <path d="M -15 -15 L 15 0 L -15 15 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- グロー効果 -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
</svg>
