<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="browserGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3367D6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="browserGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7139;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="browserGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="400" height="120" rx="15" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- ブラウザアイコン群 -->
  <g transform="translate(80, 60)">
    <!-- Chrome -->
    <g transform="translate(-40, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient1)" opacity="0.9"/>
      <circle cx="0" cy="0" r="15" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="url(#browserGradient1)" opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>
    
    <!-- Firefox -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient2)" opacity="0.9"/>
      <circle cx="0" cy="0" r="15" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="url(#browserGradient2)" opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>
    
    <!-- Edge -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="20" fill="url(#browserGradient3)" opacity="0.9"/>
      <circle cx="0" cy="0" r="15" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="0" cy="0" r="10" fill="url(#browserGradient3)" opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- 選択矢印 -->
  <g transform="translate(80, 60)">
    <path d="M -25 -8 L -15 0 L -25 8 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-20" cy="0" r="3" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- テキスト "BrowserSelector" -->
  <text x="200" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">
    Browser
  </text>
  <text x="200" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">
    Selector
  </text>
  
  <!-- サブタイトル -->
  <text x="200" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="12" 
        fill="#E3F2FD" text-anchor="middle" opacity="0.8">
    Choose Your Browser
  </text>
  
  <!-- 装飾的な要素 -->
  <circle cx="320" cy="30" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="330" cy="40" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="340" cy="35" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  
  <circle cx="320" cy="90" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="330" cy="80" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="340" cy="85" r="2.5" fill="#FFFFFF" opacity="0.5"/>
</svg>
