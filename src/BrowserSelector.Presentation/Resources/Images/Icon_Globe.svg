<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- グローブの外枠 -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="url(#globeGradient)" stroke-width="2"/>
  
  <!-- 経線 -->
  <path d="M 2 12 L 22 12" stroke="url(#globeGradient)" stroke-width="1" opacity="0.6"/>
  <path d="M 12 2 L 12 22" stroke="url(#globeGradient)" stroke-width="1" opacity="0.6"/>
  
  <!-- 緯線 -->
  <path d="M 4 6 Q 12 8 20 6" stroke="url(#globeGradient)" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 4 18 Q 12 16 20 18" stroke="url(#globeGradient)" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- 中心点 -->
  <circle cx="12" cy="12" r="2" fill="url(#globeGradient)"/>
